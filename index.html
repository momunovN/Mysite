<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация с капчей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-form">
        <h2>Вход в систему</h2>
        <input type="text" id="login" placeholder="Логин" required><br>
        <input type="password" id="password" placeholder="Пароль" required><br>
        
        <div class="captcha-container">
            <h3>Соберите картинку в правильном порядке</h3>
            <div id="captcha-puzzle" class="puzzle"></div>
            <div id="captcha-pool" class="pool"></div>
        </div>
        
        <button onclick="checkCaptcha()">Войти</button>
        <p id="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
